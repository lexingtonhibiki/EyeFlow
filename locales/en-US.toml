# EyeFlow UI strings (English). Key set must match `locales/zh-CN.toml` exactly —
# `build.rs` treats zh-CN as the single source of truth and **fails the build**
# on a missing or extra key.
#
# Conventions (see docs/adr/0008-i18n-self-built-tr-layer.md):
#   · flat table, one `key = "value"` per line
#   · `{name}` placeholders; the English set must be a SUBSET of the Chinese one
#   · `|` splits plural forms: form 0 for n == 1, form 1 otherwise
#   · avoid ✓ / ▶ / 👀 / 👏 here: Segoe UI has no glyphs for them (only
#     seguisym.ttf does, and T11 checks the English table against Segoe UI alone)
#   · avoid `{m}`: reserved for the human_duration zero-minute trap (T12)

# ── Tray ────────────────────────────────────────────────────────────────
"tray.open_settings" = "Open settings…"
"tray.toggle_enabled" = "Enable reminders"
"tray.rest_now" = "Rest now"
# \t is the Windows menu accelerator separator; it must survive translation
"tray.rest_now_hotkey" = "Rest now\tCtrl+Shift+E"
"tray.toggle_pause" = "Pause for one hour"
"tray.resume" = "Resume reminders"
"tray.toggle_sound" = "Sound cue"
"tray.quit" = "Quit"
"tray.tooltip" = "EyeFlow eye-care reminder"

# ── Today's stats ───────────────────────────────────────────────────────
"stats.separator" = " · "
"stats.dot" = "●"
"stats.count" = "{n}"
"stats.completed_label" = "Completed today"
"stats.natural_label" = "({n} natural)"
"stats.skipped_label" = "skipped"
"stats.postponed_label" = "postponed"
# `{n}-day streak` 是复合名词，`|` 的二元复数约定表达不了它（ADR-0008 §能力边界），
# 0 / 1 两读都生硬。改用「in a row」措辞绕开复合名词，`|` 就能用了：
#   0 → "· 0 days in a row" / 1 → "· 1 day in a row" / 3 → "· 3 days in a row"
# 形态与托盘 tooltip 的 `stats.streak` 一致，状态条多带一个 `·` 分隔符。
"stats.streak_label" = "· {n} day in a row|· {n} days in a row"
"stats.done" = "1 break today|{n} breaks today"
"stats.skipped" = "1 skipped|{n} skipped"
"stats.postponed" = "1 postponed|{n} postponed"
"stats.completed" = "1 completed today|{n} completed today"
"stats.postponed_suffix" = " · 1 postponed| · {n} postponed"
"stats.streak" = "{n} days in a row"

