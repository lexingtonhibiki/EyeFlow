# ── Eye-care tips ───────────────────────────────────────────────────────
"tip.1" = "Move your gaze to something more than 6 m (20 ft) away to relax the focusing muscle."
"tip.2" = "Blinking drops from about 15 times a minute to 5~7 while you stare at a screen — blink fully, a few times now."
"tip.3" = "Fix your gaze on the farthest point you can see out the window and hold it until the timer ends."
"tip.4" = "Move your shoulders and neck while you are at it: the top of the screen should sit just below eye level, about an arm's length away."
"tip.5" = "If your eyes feel dry, close them gently for a few seconds so the tear film can spread again."
"tip.6" = "Eyes tire least when screen brightness matches the room — check the ambient light while you rest."
"tip.7" = "After two hours of continuous screen time, it is worth standing up and leaving the screen for 15 minutes."
