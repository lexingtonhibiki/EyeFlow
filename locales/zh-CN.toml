# EyeFlow 界面文案（简体中文）—— **唯一事实来源**
#
# 格式约定（ADR-0008）：
#   · 扁平表，一行一个 `key = "value"`，无嵌套表、无转义（除 `\t` 与 `\\`）
#   · key 全小写点分（`tray.open_settings`）
#   · `{name}` 是占位符；调用点写 `tr(key).replace("{name}", …)`
#   · `|` 分隔复数形态：第 1 段是 n == 1，第 2 段是 n != 1
#   · 本文件的键集合是唯一基准：`build.rs` 以它为准，
#     en-US 缺任一键或多出键都会让**构建失败**
#   · 改文案只改这两个文件，代码调用点零改动
#
# 与代码的对应关系见 docs/adr/0008-i18n-self-built-tr-layer.md。

