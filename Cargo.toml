[package]
name = "eyeflow"
version = "0.7.1"
edition = "2021"
rust-version = "1.95"
description = "EyeFlow — context-aware eye-care break reminder for Windows / 上下文感知的极简护眼提醒工具"
license = "MIT"
repository = "https://github.com/lexingtonhibiki/EyeFlow"
readme = "README.md"
keywords = ["eye-care", "break-reminder", "20-20-20", "tray", "windows"]
categories = ["gui"]
build = "build.rs"

[dependencies]
# GUI — glow backend keeps the binary small; wgpu (the 0.34+ default) is unnecessary here
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"

# System tray + global hotkey (both must be created on the thread that runs the Win32 message loop)
tray-icon = "0.24"
global-hotkey = "0.8"

# Audio — synthesized cues plus decoders for user-supplied files (wav / mp3 / ogg / flac / m4a)
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac", "mp4"] }

# Native file dialogs (custom cue / strict-mode wallpaper) and image decoding for the wallpaper
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

# 可选的更新检查（`update-check` feature）——对 GitHub Releases API 的只读查询。
#
# v0.6 曾把它默认关掉：ureq 的默认 features 会把 rustls + ring（大块汇编加密代码）
# 无条件拖进二进制，而当时 `update_check_enabled` 默认就是 false，实测省下
# 1,139,200 B（10,224,640 → 9,085,440，-11.14%）。见 docs/adr/0007-v0.6-scope.md 判决五。
#
# **v0.7.0 起改回默认开启**：设置窗现在的「关于」页有「启动时检查更新」与「前往下载」，
# 而默认关掉 feature 意味着**下载版里那个开关根本不存在**（用户看到的是一行「此构建
# 未包含在线更新检查」）——把一个自己都解释不清的空缺当成"体积优化"是错的。
# 代价就是那 1.1 MB，仍然只有 Electron 类竞品的十分之一。
# 想要极限体积的构建：`cargo build --release --no-default-features`（回到 ~8.66 MB）。
ureq = { version = "3", optional = true }
serde_json = { version = "1", optional = true }

# Windows API
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # GetUserDefaultLocaleName：首次运行时决定界面语言的初值（ADR-0008）
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

# Config / persistence
serde = { version = "1", features = ["derive"] }
toml = "1"

# Utilities
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
rand = "0.9"

[features]
# 在线更新检查所需的 TLS + JSON 栈，**v0.7.0 起默认开启**（理由见上方 ureq 注释）。
# 想要最小体积：cargo build --release --no-default-features
default = ["update-check"]
update-check = ["dep:ureq", "dep:serde_json"]

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
