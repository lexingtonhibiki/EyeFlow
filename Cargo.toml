[package]
name = "eyeflow"
version = "0.5.1"
edition = "2021"
rust-version = "1.95"
description = "EyeFlow — context-aware eye-care break reminder for Windows / 上下文感知的极简护眼提醒工具"
license = "MIT"
repository = "https://github.com/lexingtonhibiki/EyeFlow"
readme = "README.md"
keywords = ["eye-care", "break-reminder", "20-20-20", "tray", "windows"]
categories = ["gui"]
build = "build.rs"

[dependencies]
# GUI — glow backend keeps the binary small; wgpu (the 0.34+ default) is unnecessary here
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"

# System tray + global hotkey (both must be created on the thread that runs the Win32 message loop)
tray-icon = "0.24"
global-hotkey = "0.8"

# Audio — synthesized cues plus decoders for user-supplied files (wav / mp3 / ogg / flac / m4a)
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac", "mp4"] }

# Native file dialogs (custom cue / strict-mode wallpaper) and image decoding for the wallpaper
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

# Optional, opt-in update check against the GitHub Releases API
ureq = "3"
serde_json = "1"

# Windows API
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

# Config / persistence
serde = { version = "1", features = ["derive"] }
toml = "1"

# Utilities
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
rand = "0.9"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
