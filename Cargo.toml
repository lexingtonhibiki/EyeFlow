[package]
name = "eyeflow"
version = "0.1.0"
edition = "2021"
description = "上下文感知的极简护眼提醒工具"

[dependencies]
# GUI
egui = "0.31"
eframe = "0.31"

# 系统托盘
tray-icon = "0.24"

# 音频
rodio = { version = "0.22", features = ["playback"] }

# Windows API
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# 配置
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"

# 工具
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
rand = "0.9"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
