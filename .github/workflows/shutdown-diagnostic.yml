          +++ b/src/ui_session.rs
          @@ -0,0 +1,38 @@
          +//! Terminal shutdown state shared by the logic and drawing halves of a UI session.
          +//!
          +//! eframe calls `ui` even after `logic` returns. Once closing starts, do not
          +//! render or create child windows while waiting for ROOT's Close to be handled.
          +//! A Close command is deferred, not immediate native-window destruction.
          +
          +use egui::{Context, ViewportCommand, ViewportId};
          +
          +#[derive(Default)]
          +pub(crate) struct UiSessionState {
          +    idle_frames: u32,
          +    closing: bool,
          +}
          +
          +impl UiSessionState {
          +    pub(crate) fn is_closing(&self) -> bool {
          +        self.closing
          +    }
          +
          +    /// Returns true when logic and UI must stop producing normal work.
          +    pub(crate) fn update(&mut self, ctx: &Context, quit: bool, needs_ui: bool) -> bool {
          +        if quit {
          +            self.closing = true;
          +        }
          +        if !self.closing {
          +            if needs_ui {
          +                self.idle_frames = 0;
          +            } else {
          +                self.idle_frames += 1;
          +                self.closing = self.idle_frames >= 3;
          +            }
          +        }
          +        if self.closing {
          +            ctx.send_viewport_cmd_to(ViewportId::ROOT, ViewportCommand::Close);
          +        }
          +        self.closing
          +    }
          +}
          diff --git a/tests/ui_session_shutdown.rs b/tests/ui_session_shutdown.rs
          new file mode 100644
          index 0000000..cddd1ed
          --- /dev/null
          +++ b/tests/ui_session_shutdown.rs
          @@ -0,0 +1,189 @@
          +//! Real egui 0.36 immediate-viewport regression; no Win32/GL or fake egui types.
          +//! The renderer below performs egui passes and the event ordering used by
          +//! eframe's glow backend, but does not create native windows. Windows UI smoke
          +//! testing remains necessary to validate native teardown and process exit.
          +
          +#[path = "../src/ui_session.rs"]
          +mod ui_session;
          +
          +use std::cell::RefCell;
          +use std::rc::Rc;
          +use std::sync::{Arc, Mutex};
          +use std::time::Duration;
          +
          +use egui::{Context, RawInput, ViewportBuilder, ViewportCommand, ViewportId};
          +use ui_session::UiSessionState;
          +
          +// No GPU in this harness: acknowledge texture updates explicitly rather than
          +// dropping pending deltas (epaint treats that as an integration bug).
          +fn run_ui(ctx: &Context, input: RawInput, ui: impl FnMut(&mut egui::Ui)) -> egui::FullOutput {
          +    let mut output = ctx.run_ui(input, ui);
          +    output.textures_delta.clear();
          +    output
          +}
          +
          +fn has_root_close(output: &egui::FullOutput) -> bool {
          +    output.viewport_output[&ViewportId::ROOT]
          +        .commands
          +        .contains(&ViewportCommand::Close)
          +}
          +
          +/// Run the real nested egui pass exactly where an eframe immediate renderer
          +/// does, recording which pass owns the Close command.
          +fn context() -> (Context, Rc<RefCell<Vec<bool>>>) {
          +    let ctx = Context::default();
          +    ctx.set_embed_viewports(false);
          +    let nested_closes = Rc::new(RefCell::new(Vec::new()));
          +    let recorded = nested_closes.clone();
          +    Context::set_immediate_viewport_renderer(move |ctx, mut viewport| {
          +        let mut input = RawInput {
          +            viewport_id: viewport.ids.this,
          +            ..Default::default()
          +        };
          +        input
          +            .viewports
          +            .insert(viewport.ids.this, Default::default());
          +        let output = run_ui(ctx, input, |ui| (viewport.viewport_ui_cb)(ui));
          +        recorded.borrow_mut().push(has_root_close(&output));
          +    });
          +    (ctx, nested_closes)
          +}
          +
          +fn draw_child(ctx: &Context, name: &str) {
          +    ctx.show_viewport_immediate(
          +        ViewportId::from_hash_of(name),
          +        ViewportBuilder::default(),
          +        |ui, _| {
          +            ui.label(name);
          +            ui.ctx().request_repaint_after(Duration::from_millis(250));
          +        },
          +    );
          +}
          +
          +#[test]
          +fn legacy_quit_still_retains_reminder_until_root_close_is_processed() {
          +    let (ctx, nested) = context();
          +    let output = run_ui(&ctx, RawInput::default(), |ui| {
          +        // Old logic sent Close then returned, but eframe still called App::ui.
          +        ui.ctx()
          +            .send_viewport_cmd_to(ViewportId::ROOT, ViewportCommand::Close);
          +        draw_child(ui.ctx(), "heads-up");
          +    });
          +    // egui correctly retains commands until the outermost pass. This does NOT
          +    // reproduce a persistent popup: it shows the old path keeps the child in
          +    // the quit frame while waiting for root teardown.
          +    assert_eq!(*nested.borrow(), vec![false]);
          +    assert!(has_root_close(&output));
          +    assert!(output
          +        .viewport_output
          +        .contains_key(&ViewportId::from_hash_of("heads-up")));
          +}
          +
          +#[test]
          +fn quit_preserves_close_in_root_output_and_does_not_spawn_children() {
          +    for children in [
          +        vec![],
          +        vec!["heads-up"],
          +        vec!["break"],
          +        vec!["strict"],
          +        vec!["flash"],
          +        vec!["settings"],
          +        vec!["heads-up", "settings"],
          +    ] {
          +        let (ctx, nested) = context();
          +        let mut state = UiSessionState::default();
          +        // First frame actually creates the requested child viewports.
          +        let _ = run_ui(&ctx, RawInput::default(), |ui| {
          +            for name in &children {
          +                draw_child(ui.ctx(), name);
          +            }
          +        });
          +        nested.borrow_mut().clear();
          +        let output = run_ui(&ctx, RawInput::default(), |ui| {
          +            assert!(state.update(ui.ctx(), true, true));
          +            // Same guard used by UiSession::ui, after logic returns.
          +            if state.is_closing() {
          +                return;
          +            }
          +            for name in &children {
          +                draw_child(ui.ctx(), name);
          +            }
          +        });
          +        assert!(has_root_close(&output), "{children:?}");
          +        assert!(nested.borrow().is_empty(), "{children:?}");
          +        for name in &children {
          +            assert!(
          +                !output
          +                    .viewport_output
          +                    .contains_key(&ViewportId::from_hash_of(name)),
          +                "{name}"
          +            );
          +        }
          +        // Even if a queued reminder/settings request arrives, closure is terminal.
          +        let output = run_ui(&ctx, RawInput::default(), |ui| {
          +            assert!(state.update(ui.ctx(), false, true));
          +        });
          +        assert!(has_root_close(&output));
          +    }
          +}
          +
          +#[test]
          +fn close_wakes_root_even_in_logic_only_mode() {
          +    let ctx = Context::default();
          +    // Consume the automatic initial repaint, then observe Close requesting one.
          +    let _ = run_ui(&ctx, RawInput::default(), |_| {});
          +    let _ = run_ui(&ctx, RawInput::default(), |_| {});
          +    let requests = Arc::new(Mutex::new(Vec::new()));
          +    let recorded = requests.clone();
          +    ctx.set_request_repaint_callback(move |request| {
          +        recorded
          +            .lock()
          +            .unwrap()
          +            .push((request.viewport_id, request.delay));
          +    });
          +    let mut state = UiSessionState::default();
          +    let output = ctx.run_logic(&RawInput::default(), |ctx| {
          +        state.update(ctx, true, false);
          +    });
          +    assert!(output.viewport_commands[&ViewportId::ROOT].contains(&ViewportCommand::Close));
          +    assert!(requests
          +        .lock()
          +        .unwrap()
          +        .contains(&(ViewportId::ROOT, Duration::ZERO)));
          +}
          +
          +#[test]
          +fn idle_close_keeps_grace_period_and_resets_when_ui_is_needed() {
          +    let ctx = Context::default();
          +    let mut state = UiSessionState::default();
          +    assert!(!state.update(&ctx, false, false));
          +    assert!(!state.update(&ctx, false, false));
          +    assert!(!state.update(&ctx, false, true));
          +    assert!(!state.update(&ctx, false, false));
          +    assert!(!state.update(&ctx, false, false));
          +    assert!(state.update(&ctx, false, false));
          +    assert!(state.is_closing());
          +    // A later session has its own fresh lifecycle and may show the next reminder.
          +    assert!(!UiSessionState::default().update(&ctx, false, true));
          +}
          +
          +#[test]
          +fn production_wiring_guards_ui_and_stops_runtime_before_tick() {
          +    // Keep the integration gate tied to App::ui, not only the helper tested above.
          +    let app = include_str!("../src/app.rs");
          +    let ui = app.split("    fn ui(&mut self,").nth(1).unwrap();
          +    let guard = ui
          +        .find("if self.lifecycle.is_closing() || self.rt.quit")
          +        .unwrap();
          +    assert!(guard < ui.find("self.show_panel(").unwrap());
          +    assert!(guard < ui.find("self.show_settings(").unwrap());
          +    assert!(app
          +        .contains("!self.lifecycle.is_closing() && ctx.input(|i| i.viewport().close_requested())"));
          +    // Settings X is still a child-window close, not application exit.
          +    assert!(app.contains("if close {\n            rt.settings = None;\n        }"));
          +    let runtime = include_str!("../src/runtime.rs");
          +    let step = runtime.split("    pub fn step(").nth(1).unwrap();
          +    assert!(step.find("if self.quit").unwrap() < step.find("self.rx.try_recv()").unwrap());
          +    let after_tray = step.split("self.handle_tray(cmd, now);").nth(1).unwrap();
          +    assert!(after_tray.find("if self.quit").unwrap() < after_tray.find("self.core.tick(").unwrap());
          +}
          '''
          BASE_HASHES = {
              "src/app.rs": "014b0aa0157421804f7a649ee41f8e9c466d09c615d1898e226ddb016bce50d9",
              "src/core.rs": "a911c4a075457f6bc8b4684e74b1dac647dd0051f5117ba067053cfde0515145",
              "src/detector.rs": "dfdf2a8cb506674c08fa85393643c382c369d8c44c9490c189e06f2207994b0a",
          }
          for name, expected in BASE_HASHES.items():
              actual = hashlib.sha256(Path(name).read_text(encoding="utf-8").encode()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Unexpected pristine baseline {name}: {actual}")
          if args.candidate:
              patch = PATCH_TEXT.encode("utf-8")
              assert hashlib.sha256(patch).hexdigest() == "94825abd61fe81cee15d38734a72e519e9528d76ec002066e5330d48aaf15fad"
              subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
              subprocess.run(["git", "apply", "-"], input=patch, check=True)
              print("Applied reviewed shutdown candidate; not a release")
          else:
              print("Original shutdown implementation retained")
          
          source = {name: Path(name).read_text(encoding="utf-8") for name in BASE_HASHES}
          
          def replace(name, old, new):
              if source[name].count(old) != 1:
                  raise SystemExit(f"Expected exactly one insertion point in {name}: {old!r}")
              source[name] = source[name].replace(old, new, 1)
          
          replace("src/app.rs", '    fn logic(&mut self, ctx: &egui::Context, _frame: &mut eframe::Frame) {', '''    fn logic(&mut self, ctx: &egui::Context, _frame: &mut eframe::Frame) {
                  // DIAGNOSTIC ONLY: identical observations in both A/B variants.
                  static TRACE_LOGIC: std::sync::atomic::AtomicUsize = std::sync::atomic::AtomicUsize::new(0);
                  let trace_index = TRACE_LOGIC.fetch_add(1, std::sync::atomic::Ordering::Relaxed);
                  let trace = trace_index < 6 || self.rt.quit;
                  if trace {
                      log::debug!("SHUTDOWN_DIAG logic enter frame={} quit={}", trace_index, self.rt.quit);
                  }''')
          replace("src/app.rs", 'self.rt.step(now);', '''self.rt.step(now);
                  if trace || self.rt.quit {
                      log::debug!("SHUTDOWN_DIAG logic after-step frame={} quit={} phase={:?} due_secs={}", trace_index, self.rt.quit, self.rt.core.phase, self.rt.core.next_break_in(now).as_secs());
                  }''')
          replace("src/app.rs", '        ctx.request_repaint_after(wait);', '''        ctx.request_repaint_after(wait);
                  if trace {
                      log::debug!("SHUTDOWN_DIAG logic exit frame={}", trace_index);
                  }''')
          replace("src/app.rs", '''        let now = Instant::now();
                  self.show_panel(&ctx, now);
                  self.show_settings(&ctx, now);''', '''        let now = Instant::now();
                  static TRACE_UI: std::sync::atomic::AtomicUsize = std::sync::atomic::AtomicUsize::new(0);
                  let trace_index = TRACE_UI.fetch_add(1, std::sync::atomic::Ordering::Relaxed);
                  let trace = trace_index < 6 || self.rt.quit;
                  if trace { log::debug!("SHUTDOWN_DIAG ui before-panel frame={}", trace_index); }
                  self.show_panel(&ctx, now);
                  if trace { log::debug!("SHUTDOWN_DIAG ui after-panel before-settings frame={}", trace_index); }
                  self.show_settings(&ctx, now);
                  if trace { log::debug!("SHUTDOWN_DIAG ui after-settings frame={}", trace_index); }''')
          
          replace("src/core.rs", '''        // 2. 离开：计时暂停；进入离开状态即视为一次自然休息（离开阈值远大于休息时长）；''', '''        // DIAGNOSTIC ONLY: sample state at most once per five-second wall-clock bucket.
                  // Read-only: never override sensor values, due time, phase or configuration.
                  static TRACE_BUCKET: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(u64::MAX);
                  let trace_bucket = std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .unwrap_or_default()
                      .as_secs() / 5;
                  if TRACE_BUCKET.swap(trace_bucket, std::sync::atomic::Ordering::Relaxed) != trace_bucket {
                      log::debug!("SHUTDOWN_DIAG tick state={:?} idle_secs={} fullscreen={} interruptible={} away_secs={} enabled={} visual={} quiet={} phase={:?} due_secs={}",
                          self.state, self.sensors.idle_secs, self.sensors.fullscreen, self.sensors.interruptible,
                          self.cfg.away_secs, self.cfg.enabled, self.cfg.visual_enabled, quiet, self.phase,
                          self.next_break_in(now).as_secs());
                  }
          
                  // 2. 离开：计时暂停；进入离开状态即视为一次自然休息（离开阈值远大于休息时长）；''')
          
          replace("src/detector.rs", '    let quns_busy = matches!(quns, Ok(st) if st == QUNS_PRESENTATION_MODE || st == QUNS_QUIET_TIME);', '''    // DIAGNOSTIC FIXTURE ONLY: the hosted runner reports Gaming indefinitely.
              // Observe its real context, but hold Desktop eligibility identically in A/B
              // so the already-visible-popup -> tray Quit behavior can be tested.
              static FIXTURE_NOTICE: std::sync::atomic::AtomicBool = std::sync::atomic::AtomicBool::new(false);
              let first_fixture_sample = !FIXTURE_NOTICE.swap(true, std::sync::atomic::Ordering::Relaxed);
              if first_fixture_sample {
                  log::warn!("SHUTDOWN_DIAG CONTROLLED DESKTOP FIXTURE: raw_quns={:?} rectangle_fullscreen={}; only fullscreen/interruptible overridden, real idle retained; NOT natural scheduling validation", quns, rect_fs);
              }
              let quns_busy = matches!(quns, Ok(st) if st == QUNS_PRESENTATION_MODE || st == QUNS_QUIET_TIME);''')
          replace("src/detector.rs", '    let fullscreen = quns_busy || rect_fs;', '''    if first_fixture_sample {
                  log::warn!("SHUTDOWN_DIAG measured_fullscreen={} forced_fullscreen=false forced_interruptible=true", quns_busy || rect_fs);
              }
              let fullscreen = false;''')
          
          for name, text in source.items():
              Path(name).write_text(text, encoding="utf-8", newline="\n")
              print(f"Applied identical diagnostic observations/fixture: {name}")
          print("CONTROLLED Desktop sensor fixture active: fullscreen=false, interruptible=true; real idle unchanged")
          '@ | Set-Content -Encoding utf8 prepare_shutdown_ab.py
      - name: Prepare two pristine source trees with identical controlled fixture
        shell: pwsh
        run: |
          git worktree add --detach candidate-source 749ab168fdc3342d73400fc01f974a10aaba2194
          if ($LASTEXITCODE -ne 0) { throw 'Could not create pristine candidate source tree' }
          python ./prepare_shutdown_ab.py
          if ($LASTEXITCODE -ne 0) { throw 'Baseline fixture preparation failed' }
          Push-Location candidate-source
          try {
            python ../prepare_shutdown_ab.py --candidate
            if ($LASTEXITCODE -ne 0) { throw 'Candidate fixture preparation failed' }
          } finally { Pop-Location }
          foreach ($file in @('core.rs','detector.rs')) {
            $baseline = (Get-FileHash "src/$file" -Algorithm SHA256).Hash
            $candidate = (Get-FileHash "candidate-source/src/$file" -Algorithm SHA256).Hash
            if ($baseline -ne $candidate) { throw "A/B fixture differs: $file" }
            Write-Output "Identical fixture $file SHA256 $baseline"
          }
      - name: Build original and candidate binaries with the same dependency cache
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Original fixture binary build failed' }
          New-Item -ItemType Directory -Force shutdown-runtime/baseline,shutdown-runtime/candidate | Out-Null
          Copy-Item target/release/eyeflow.exe shutdown-runtime/baseline/eyeflow.exe
          cargo build --release --locked --manifest-path candidate-source/Cargo.toml --target-dir target
          if ($LASTEXITCODE -ne 0) { throw 'Candidate fixture binary build failed' }
          Copy-Item target/release/eyeflow.exe shutdown-runtime/candidate/eyeflow.exe
      - name: Install official MSYS2 Mesa test dependency
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-mesa mingw-w64-ucrt-x86_64-binutils
      - name: Stage identical software OpenGL libraries beside both test executables
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p shutdown-diagnostics
          pacman -Q > shutdown-diagnostics/msys2-package-versions.txt
          # Copy only Mesa's two WGL entry DLLs and their recursive UCRT64 imports.
          # No DLL is installed in Windows directories; normal OS imports stay OS-owned.
          declare -A staged=()
          queue=(opengl32.dll libgallium_wgl.dll)
          while ((${#queue[@]})); do
            dll="${queue[0]}"
            queue=("${queue[@]:1}")
            key="${dll,,}"
            [[ -n "${staged[$key]:-}" ]] && continue
            src=$(find /ucrt64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)
            if [[ -z "$src" ]]; then
              echo "Missing official registry DLL: $dll" >&2
              exit 1
            fi
            staged[$key]=1
            cp "$src" "shutdown-runtime/baseline/$(basename "$src")"
            cp "$src" "shutdown-runtime/candidate/$(basename "$src")"
            while IFS= read -r dep; do
              dep="${dep//$'\r'/}"
              [[ -z "$dep" ]] && continue
              found=$(find /ucrt64/bin -maxdepth 1 -type f -iname "$dep" -print -quit)
              if [[ -n "$found" ]]; then
                queue+=("$dep")
              elif [[ "${dep,,}" == api-ms-win-* || "${dep,,}" == ext-ms-win-* || -f "/c/Windows/System32/$dep" ]]; then
                : # Existing OS DLL/API set, never copied or modified.
              else
                echo "Unresolved import $dep from $dll; stop rather than fetch elsewhere" >&2
                exit 1
              fi
            done < <(/ucrt64/bin/objdump.exe -p "$src" | sed -n 's/^[[:space:]]*DLL Name: //p')
          done
          sha256sum shutdown-runtime/baseline/*.dll shutdown-runtime/candidate/*.dll | tee shutdown-diagnostics/mesa-dll-sha256.txt
      - name: Write isolated native smoke script
        shell: python
        run: |
          from pathlib import Path
          script = r'''
          # Native app smoke only. Run on an isolated Windows runner, never a user's desktop.
          # Exercises Win32 tray -> muda MenuEvent -> Runtime::step -> native eframe teardown.
          # Synthetic WM_COMMAND is not a physical mouse click; the real application pipeline
          # after native menu selection is exercised. MN_GETHMENU is an undocumented Win32
          # menu message; inability to resolve it is INCONCLUSIVE, never a passing test.
          [CmdletBinding()]
          param(
              [Parameter(Mandatory=$true)][string]$Binary,
              [Parameter(Mandatory=$true)][string]$OutputDirectory,
              [ValidateSet('tray','root-close')][string]$ExitMethod = 'tray',
              [switch]$CloseSettingsFirst,
              [switch]$RequireSoftwareRenderer,
              [int]$PopupTimeoutSeconds = 90,
              [int]$ExitTimeoutSeconds = 5
          )
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force $OutputDirectory | Out-Null
          $OutputDirectory = (Resolve-Path $OutputDirectory).Path
          $result = [ordered]@{controlledDesktopFixture=$true; naturalSchedulingValidated=$false; status='inconclusive'; reason='Not started'; method=$ExitMethod; binary=$Binary; settingsClosed=[bool]$CloseSettingsFirst}
          $proc = $null
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public class EFWindow { public long Handle; public uint Pid; public string Title; public string Class; public bool Visible; }
          public static class EFWin {
           public delegate bool EnumProc(IntPtr hwnd, IntPtr data);
           [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc callback, IntPtr data);
           [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
           [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr h,StringBuilder s,int n);
           [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr h,StringBuilder s,int n);
           [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
           [DllImport("user32.dll", SetLastError=true)] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
           [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr SendMessageTimeout(IntPtr h,uint m,IntPtr w,IntPtr l,uint flags,uint timeout,out IntPtr result);
           [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr menu);
           [DllImport("user32.dll")] public static extern uint GetMenuItemID(IntPtr menu,int pos);
           [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetMenuString(IntPtr menu,uint item,StringBuilder text,int size,uint flags);
           public static EFWindow[] Windows(uint wanted) {
            var list=new List<EFWindow>();
            EnumWindows((h,d)=>{uint pid;GetWindowThreadProcessId(h,out pid);if(pid==wanted){var t=new StringBuilder(1024);var c=new StringBuilder(256);GetWindowText(h,t,t.Capacity);GetClassName(h,c,c.Capacity);list.Add(new EFWindow{Handle=h.ToInt64(),Pid=pid,Title=t.ToString(),Class=c.ToString(),Visible=IsWindowVisible(h)});}return true;},IntPtr.Zero);
            return list.ToArray();
           }
          }
          '@
          function Snapshot([string]$name) {
              if ($proc) { @([EFWin]::Windows([uint32]$proc.Id)) | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $OutputDirectory "$name-windows.json") }
              try {
                  Add-Type -AssemblyName System.Windows.Forms
                  Add-Type -AssemblyName System.Drawing
                  $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
                  $bitmap = New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
                  $g = [System.Drawing.Graphics]::FromImage($bitmap)
                  $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
                  $bitmap.Save((Join-Path $OutputDirectory "$name.png"))
                  $g.Dispose(); $bitmap.Dispose()
              } catch { $_.ToString() | Set-Content (Join-Path $OutputDirectory "$name-screenshot-error.txt") }
          }
          function Post([long]$handle,[uint32]$message,[long]$wparam,[long]$lparam) {
              if (-not [EFWin]::PostMessage([IntPtr]$handle,$message,[IntPtr]$wparam,[IntPtr]$lparam)) { throw "PostMessage failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          }
          try {
              if ($env:OS -ne 'Windows_NT') { throw 'Windows required' }
              # Do not accidentally interact with an existing user's instance/global mutex.
              if (Get-Process eyeflow -ErrorAction SilentlyContinue) { throw 'Existing EyeFlow process: use a clean isolated runner' }
              $appdata = Join-Path $OutputDirectory 'appdata'
              New-Item -ItemType Directory -Force (Join-Path $appdata 'eyeflow') | Out-Null
              @'
          language = "en-US"
          visual_enabled = true
          sound_enabled = false
          strict_mode = false
          hotkey_enabled = false
          update_check_enabled = false
          quiet_start = "00:00"
          quiet_end = "00:00"
          '@ | Set-Content -Encoding UTF8 (Join-Path $appdata 'eyeflow/config.toml')
              $info = New-Object System.Diagnostics.ProcessStartInfo
              $info.FileName = (Resolve-Path $Binary).Path
              $info.UseShellExecute = $false
              $info.EnvironmentVariables['APPDATA'] = $appdata
              $info.EnvironmentVariables['EYEFLOW_DEMO'] = '1'
              $info.EnvironmentVariables['RUST_LOG'] = 'debug,eframe=debug,egui_glow=debug'
              if ($RequireSoftwareRenderer) {
                  # Only this child process uses software rendering; no driver/system settings.
                  $info.EnvironmentVariables['LIBGL_ALWAYS_SOFTWARE'] = 'true'
                  $info.EnvironmentVariables['GALLIUM_DRIVER'] = 'llvmpipe'
              }
              $proc = [System.Diagnostics.Process]::Start($info)
              $result.pid = $proc.Id
              if ($RequireSoftwareRenderer) {
                  $rendererLog = Join-Path $appdata 'eyeflow/eyeflow.log'
                  $rendererDeadline = [DateTime]::UtcNow.AddSeconds(30)
                  $rendererText = ''
                  while ([DateTime]::UtcNow -lt $rendererDeadline -and -not $proc.HasExited) {
                      if (Test-Path -LiteralPath $rendererLog) {
                          $rendererText = Get-Content -Raw -LiteralPath $rendererLog
                          if ($rendererText -match 'opengl renderer:') { break }
                      }
                      Start-Sleep -Milliseconds 100
                  }
                  $version = [regex]::Match($rendererText, 'opengl version: (?:OpenGL ES )?(\d+)\.(\d+)[^\r\n]*')
                  $renderer = [regex]::Match($rendererText, 'opengl renderer: ([^\r\n]+)')
                  $result.glVersion = $version.Value
                  $result.glRenderer = $renderer.Groups[1].Value
                  Write-Output "Renderer evidence: $($result.glVersion); $($result.glRenderer)"
                  if (-not $version.Success -or [int]$version.Groups[1].Value -lt 2 -or $result.glRenderer -notmatch '(?i)llvmpipe') {
                      throw 'Software GL precondition not verified: require actual logged OpenGL >=2 and llvmpipe, no version spoofing'
                  }
              }
              $deadline = [DateTime]::UtcNow.AddSeconds($PopupTimeoutSeconds)
              $popup = $null
              while ([DateTime]::UtcNow -lt $deadline -and -not $proc.HasExited) {
                  $popup = @([EFWin]::Windows([uint32]$proc.Id) | Where-Object {$_.Visible -and $_.Title -like 'EyeFlow Reminder *'})
                  if ($popup.Count -gt 0) { break }
                  Start-Sleep -Milliseconds 100
              }
              if (-not $popup -or $popup.Count -eq 0) {
                  # Observation only AFTER the popup precondition has failed. WM_NULL does
                  # not change app state; bounded SendMessageTimeout tests message-loop life.
                  $responses = @([EFWin]::Windows([uint32]$proc.Id) | ForEach-Object {
                      $reply = [IntPtr]::Zero
                      $timer = [System.Diagnostics.Stopwatch]::StartNew()
                      $sent = [EFWin]::SendMessageTimeout([IntPtr]$_.Handle,0,[IntPtr]::Zero,[IntPtr]::Zero,2,500,[ref]$reply)
                      $errorCode = if ($sent -eq [IntPtr]::Zero) { [Runtime.InteropServices.Marshal]::GetLastWin32Error() } else { 0 }
                      $timer.Stop()
                      [ordered]@{handle=$_.Handle; title=$_.Title; class=$_.Class; responded=($sent -ne [IntPtr]::Zero); elapsedMs=$timer.ElapsedMilliseconds; win32Error=$errorCode}
                  })
                  $responses | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $OutputDirectory 'timeout-responsiveness.json')
                  throw 'No actual visible reminder: startup, desktop, WGL, sensor or scheduling precondition failed; inspect logs and timeout responsiveness'
              }
              Snapshot 'before-exit'
              $result.popupHandles = @($popup | ForEach-Object {$_.Handle})
              if ($CloseSettingsFirst) {
                  $settings = @([EFWin]::Windows([uint32]$proc.Id) | Where-Object {$_.Visible -and $_.Title -eq 'EyeFlow Settings'})
                  if ($settings.Count -ne 1) { throw 'Cannot uniquely resolve settings HWND' }
                  Post $settings[0].Handle 0x0010 0 0
                  Start-Sleep -Milliseconds 750
                  if ($proc.HasExited) { $result.status='failed'; throw 'Closing settings unexpectedly terminated app' }
                  if (-not @([EFWin]::Windows([uint32]$proc.Id) | Where-Object {$_.Visible -and $_.Title -like 'EyeFlow Reminder *'}).Count) { $result.status='failed'; throw 'Closing settings unexpectedly removed reminder' }
              }
              if ($ExitMethod -eq 'tray') {
                  $tray = @([EFWin]::Windows([uint32]$proc.Id) | Where-Object {$_.Class -eq 'tray_icon_app'})
                  if ($tray.Count -ne 1) { throw 'Cannot uniquely resolve application tray HWND' }
                  Post $tray[0].Handle 6002 0 0x0205 # tray-icon0.24 WM_USER_TRAYICON / WM_RBUTTONUP
                  $menuWindow = @()
                  $until = [DateTime]::UtcNow.AddSeconds(3)
                  while ([DateTime]::UtcNow -lt $until) {
                      $menuWindow = @([EFWin]::Windows([uint32]$proc.Id) | Where-Object {$_.Visible -and $_.Class -eq '#32768'})
                      if ($menuWindow.Count -eq 1) { break }
                      Start-Sleep -Milliseconds 50
                  }
                  if ($menuWindow.Count -ne 1) { throw 'Native tray menu unavailable on this desktop' }
                  $menu = [IntPtr]::Zero
                  $sent = [EFWin]::SendMessageTimeout([IntPtr]$menuWindow[0].Handle,0x01E1,[IntPtr]::Zero,[IntPtr]::Zero,2,1000,[ref]$menu)
                  if ($sent -eq [IntPtr]::Zero -or $menu -eq [IntPtr]::Zero) { throw 'Could not inspect native popup HMENU' }
                  $count = [EFWin]::GetMenuItemCount($menu)
                  if ($count -lt 1) { throw 'Empty native tray menu' }
                  $text = New-Object System.Text.StringBuilder 256
                  [void][EFWin]::GetMenuString($menu,[uint32]($count-1),$text,256,0x400)
                  $command = [EFWin]::GetMenuItemID($menu,$count-1)
                  if ($command -eq [uint32]::MaxValue -or $text.ToString() -notmatch '(?i)exit|quit|退出') { throw "Last menu item is not verified Quit: $text" }
                  $result.menuText=$text.ToString(); $result.commandId=$command
                  Post $tray[0].Handle 0x001F 0 0 # Cancel native menu mode before command dispatch.
                  Start-Sleep -Milliseconds 100
                  Post $tray[0].Handle 0x0111 $command 0 # Real muda subclass WM_COMMAND -> MenuEvent.
              } else {
                  $root = @([EFWin]::Windows([uint32]$proc.Id) | Where-Object {$_.Title -eq 'EyeFlow' -and $_.Class -ne 'tray_icon_app'})
                  if ($root.Count -ne 1) { throw 'Cannot uniquely resolve root anchor HWND' }
                  Post $root[0].Handle 0x0010 0 0
              }
              $exited = $proc.WaitForExit($ExitTimeoutSeconds*1000)
              $log = Join-Path $appdata 'eyeflow/eyeflow.log'
              if ($ExitMethod -eq 'tray') {
                  $result.trayQuitObserved = (Test-Path -LiteralPath $log) -and ((Get-Content -Raw -LiteralPath $log) -match '用户从托盘退出')
                  if (-not $result.trayQuitObserved) {
                      throw 'No log evidence that real tray Quit reached Runtime; dispatch precondition inconclusive, not a shutdown regression'
                  }
              }
              $result.status='failed' # Visible popup AND actual Quit handling established.
              if (-not $exited) { throw "App remained alive after $ExitTimeoutSeconds seconds following verified Quit" }
              $result.exitCode=$proc.ExitCode
              if ($proc.ExitCode -ne 0) { throw "Nonzero process exit: $($proc.ExitCode)" }
              if (@([EFWin]::Windows([uint32]$proc.Id)).Count -ne 0) { throw 'PID-owned HWND remains after exit' }
              $result.status='passed'; $result.reason='Visible reminder established; requested exit completed normally and no PID HWND survived'
          } catch {
              $result.reason=$_.ToString()
          } finally {
              Snapshot 'after-exit'
              # Cleanup happens only AFTER recording outcome. Forced termination never counts as pass.
              if ($proc -and -not $proc.HasExited) { $result.forcedCleanup=$true; $proc.Kill(); [void]$proc.WaitForExit(5000) }
              $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 (Join-Path $OutputDirectory 'result.json')
              $result | ConvertTo-Json -Depth 8 | Write-Output
          }
          if ($result.status -eq 'passed') { exit 0 }
          if ($result.status -eq 'inconclusive') { exit 2 }
          exit 1
          '''
          Path("Test-EyeFlowShutdown.ps1").write_text(script, encoding="utf-8")
      - name: Run BOTH native variants even if original shutdown fails
        shell: pwsh
        run: |
          # Each child script records evidence and cleans up only its own process.
          # Do not stop after original failure; the candidate must run identically.
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($variant in @('baseline','candidate')) {
            Write-Output "===== CONTROLLED FIXTURE VARIANT $variant ====="
            & pwsh -NoProfile -File ./Test-EyeFlowShutdown.ps1 -Binary "./shutdown-runtime/$variant/eyeflow.exe" -OutputDirectory "./shutdown-diagnostics/$variant" -ExitMethod tray -CloseSettingsFirst -RequireSoftwareRenderer
            Write-Output "Variant $variant diagnostic exit code: $LASTEXITCODE"
          }
          exit 0
      - name: Evaluate bounded A/B evidence without overstating reproduction
        shell: pwsh
        run: |
          $baselinePath = 'shutdown-diagnostics/baseline/result.json'
          $candidatePath = 'shutdown-diagnostics/candidate/result.json'
          if (-not (Test-Path $baselinePath) -or -not (Test-Path $candidatePath)) { throw 'Missing native result; A/B inconclusive' }
          $b = Get-Content -Raw $baselinePath | ConvertFrom-Json
          $c = Get-Content -Raw $candidatePath | ConvertFrom-Json
          $originalFailureVerified = $b.status -eq 'failed' -and $b.trayQuitObserved -eq $true -and @($b.popupHandles).Count -gt 0
          $verdict = 'inconclusive'
          if ($b.status -eq 'passed' -and $c.status -eq 'passed') {
            $verdict = 'not-reproduced: both exit correctly under controlled fixture'
          } elseif ($originalFailureVerified -and $c.status -eq 'passed') {
            $verdict = 'original failure and candidate pass verified under controlled fixture only'
          } elseif ($c.status -eq 'failed') {
            $verdict = 'candidate did not satisfy native shutdown acceptance'
          }
          $summary = [ordered]@{verdict=$verdict; baseline=$b.status; candidate=$c.status; originalFailureVerified=$originalFailureVerified; naturalSchedulingValidated=$false; softwareRenderer='llvmpipe'; fixture='fullscreen=false, interruptible=true, real idle retained'}
          $summary | ConvertTo-Json | Tee-Object -FilePath shutdown-diagnostics/ab-summary.json
          if ($c.status -eq 'failed') { exit 1 }
          if ($verdict -eq 'inconclusive') { exit 2 }
      - name: Print isolated evidence for both variants even on failure
        if: always()
        shell: pwsh
        run: |
          foreach ($variant in @('baseline','candidate')) {
            foreach ($relative in @('result.json','before-exit-windows.json','after-exit-windows.json','timeout-responsiveness.json','before-exit-screenshot-error.txt','after-exit-screenshot-error.txt','appdata/eyeflow/config.toml','appdata/eyeflow/eyeflow.log')) {
              Write-Output "===== BEGIN $variant/$relative ====="
              $file = Join-Path "shutdown-diagnostics/$variant" $relative
              if (Test-Path -LiteralPath $file -PathType Leaf) {
                $lines = @(Get-Content -LiteralPath $file -Encoding utf8 -ErrorAction Continue)
                if ($lines.Count -gt 600) {
                  $lines | Select-Object -First 200 | Write-Output
                  Write-Output "... omitted $($lines.Count - 600) middle lines ..."
                  $lines | Select-Object -Last 400 | Write-Output
                } else { $lines | Write-Output }
              } else { Write-Output '(not created)' }
              Write-Output "===== END $variant/$relative ====="
            }
          }
          if (Test-Path shutdown-diagnostics/ab-summary.json) { Get-Content shutdown-diagnostics/ab-summary.json }
      - name: Upload diagnostic evidence only - never distribute fixture binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eyeflow-controlled-shutdown-ab-${{ github.run_id }}
          path: shutdown-diagnostics/
          if-no-files-found: warn
