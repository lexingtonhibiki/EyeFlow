name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $manifest = (Get-Content Cargo.toml -Raw) -match '(?m)^version\s*=\s*"([^"]+)"'
          $cargoVer = $Matches[1]
          if ($tag -ne $cargoVer) {
            throw "tag v$tag != Cargo.toml $cargoVer"
          }
          "version=$tag" >> $env:GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # installer.nsi 内的 Icon/File/OutFile 相对路径以脚本所在目录(installer\)解析,
      # dist\ 须预先存在;PRODUCT_VERSION 由 /D 注入(不带 v 前缀)。
      # 产物: dist\EyeFlow-<ver>-Setup.exe
      - name: Build installer
        shell: cmd
        run: |
          if not exist dist mkdir dist
          makensis /DPRODUCT_VERSION=${{ steps.ver.outputs.version }} installer\installer.nsi

      - name: Package portable zip and SHA256
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item target/release/eyeflow.exe "eyeflow-$v-x86_64-portable.exe"
          Compress-Archive -Path "eyeflow-$v-x86_64-portable.exe" -DestinationPath "dist/eyeflow-$v-x86_64-portable.zip" -Force
          Remove-Item "eyeflow-$v-x86_64-portable.exe"
          foreach ($name in @("EyeFlow-$v-Setup.exe", "eyeflow-$v-x86_64-portable.zip")) {
            (Get-FileHash "dist/$name" -Algorithm SHA256).Hash |
              Out-File "dist/$name.sha256" -Encoding ascii
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload build artifacts (debug/diagnostics)
        uses: actions/upload-artifact@v4
        with:
          name: eyeflow-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256

      - name: Create GitHub Release (auto-published)
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
