name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $manifest = (Get-Content Cargo.toml -Raw) -match '(?m)^version\s*=\s*"([^"]+)"'
          $cargoVer = $Matches[1]
          if ($tag -ne $cargoVer) {
            throw "tag v$tag != Cargo.toml $cargoVer"
          }
          "version=$tag" >> $env:GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --locked

      # 守卫:installer.nsi 必须带 UTF-8 BOM。丢了 BOM 时 makensis 在英文 CI
      # 上(ACP=1252)不会报错,而是把中文按 CP1252 逐字节解成乱码写进安装包——
      # v0.7.0/v0.7.1 的乱码安装包就是这么发出去的。这里按字节断言,失败即拦住发版。
      - name: Check installer BOM (UTF-8)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("installer/installer.nsi")
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "installer/installer.nsi 缺少 UTF-8 BOM —— 安装界面会乱码。请在文件开头写回 EF BB BF。"
          }
          "installer.nsi UTF-8 BOM OK"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # installer.nsi 内的 Icon/File/OutFile 相对路径以脚本所在目录(installer\)解析,
      # dist\ 须预先存在;PRODUCT_VERSION 由 /D 注入(不带 v 前缀)。
      # 产物: dist\EyeFlow-<ver>-Setup.exe
      # choco 安装 NSIS 后当前任务的 PATH 不会刷新,优先用绝对路径,回退到 shim。
      - name: Build installer
        shell: cmd
        run: |
          if not exist dist mkdir dist
          set "NSIS_EXE=C:\Program Files (x86)\NSIS\makensis.exe"
          if not exist "%NSIS_EXE%" set "NSIS_EXE=makensis"
          "%NSIS_EXE%" /DPRODUCT_VERSION=${{ steps.ver.outputs.version }} installer\installer.nsi

      - name: Package portable zip and SHA256
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item target/release/eyeflow.exe "eyeflow-$v-x86_64-portable.exe"
          Compress-Archive -Path "eyeflow-$v-x86_64-portable.exe" -DestinationPath "dist/eyeflow-$v-x86_64-portable.zip" -Force
          Remove-Item "eyeflow-$v-x86_64-portable.exe"
          foreach ($name in @("EyeFlow-$v-Setup.exe", "eyeflow-$v-x86_64-portable.zip")) {
            (Get-FileHash "dist/$name" -Algorithm SHA256).Hash |
              Out-File "dist/$name.sha256" -Encoding ascii
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload build artifacts (debug/diagnostics)
        uses: actions/upload-artifact@v4
        with:
          name: eyeflow-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256

      - name: Create GitHub Release (auto-published)
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
