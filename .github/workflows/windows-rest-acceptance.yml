name: Windows rest settings acceptance

on:
  push:
    branches:
      - "feature/rest-status-windows-acceptance-20261113"
      - "test/theme-release-acceptance-20261113"

permissions:
  contents: read

concurrency:
  group: windows-rest-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-rest-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format, lint and tests on exact candidate
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --bins -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare private software OpenGL for native test
        shell: pwsh
        env:
          CONDA_PKGS_DIRS: ${{ runner.temp }}/eyeflow-conda-cache
        run: |
          $conda = Join-Path $env:CONDA "Scripts/conda.exe"
          if (-not (Test-Path $conda)) { throw "Runner's preinstalled Conda is missing" }
          $prefix = Join-Path $env:RUNNER_TEMP "eyeflow-mesa"
          & $conda create --yes --no-default-packages --override-channels --channel https://conda.anaconda.org/conda-forge --prefix $prefix "mesa-llvmpipe=26.2.5=hca91ad9_0"
          if ($LASTEXITCODE -ne 0) { throw "Private Mesa dependency installation failed" }
          $package = "mesa-llvmpipe-26.2.5-hca91ad9_0"
          $expectedHash = "320e4d51ab471ac19e38c4104d4dd6ac1efcdda655b45a98830db6be39cb614f"
          $archive = Join-Path $env:CONDA_PKGS_DIRS "$package.conda"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw "Mesa package archive SHA256 mismatch"
          }
          $record = Get-Content (Join-Path $prefix "conda-meta/$package.json") -Raw | ConvertFrom-Json
          if ($record.sha256 -ne $expectedHash) { throw "Installed Mesa metadata SHA256 mismatch" }
          foreach ($dll in @("opengl32.dll", "libgallium_wgl.dll")) {
            if (-not (Test-Path (Join-Path $prefix "Library/bin/$dll"))) { throw "Missing Mesa DLL: $dll" }
          }
          & $conda list --prefix $prefix --explicit
          if ($LASTEXITCODE -ne 0) { throw "Could not record resolved renderer dependencies" }
          Copy-Item target/release/eyeflow.exe (Join-Path $prefix "Library/bin/eyeflow.exe")
          if ((Get-FileHash target/release/eyeflow.exe).Hash -ne (Get-FileHash (Join-Path $prefix "Library/bin/eyeflow.exe")).Hash) {
            throw "Private test executable differs from built executable"
          }

      - name: Production binary native-window and quit smoke
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: python scripts/test-tray-quit.py "$env:RUNNER_TEMP/eyeflow-mesa/Library/bin/eyeflow.exe" --expected-renderer llvmpipe
      - name: Build separate instrumented acceptance binary
        shell: pwsh
        run: |
          $production = "$env:RUNNER_TEMP/eyeflow-mesa/Library/bin/eyeflow.exe"
          $productionHash = (Get-FileHash $production).Hash
          cargo build --locked --release --features desktop-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/eyeflow.exe "$env:RUNNER_TEMP/eyeflow-mesa/Library/bin/eyeflow-acceptance.exe"
          if ((Get-FileHash target/release/eyeflow.exe).Hash -ne (Get-FileHash "$env:RUNNER_TEMP/eyeflow-mesa/Library/bin/eyeflow-acceptance.exe").Hash) { throw "Acceptance binary copy mismatch" }
          if ((Get-FileHash $production).Hash -ne $productionHash) { throw "Production smoke binary was modified" }
      - name: Install isolated GUI test dependencies
        run: python -m pip install PyAutoGUI==0.9.54 Pillow==11.3.0
      - name: Real widget edit, tab round-trip, restart and screenshots
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: python scripts/test-rest-settings-windows.py "$env:RUNNER_TEMP/eyeflow-mesa/Library/bin/eyeflow-acceptance.exe" --output acceptance-evidence
      - name: Keep acceptance evidence, including failures (not a Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rest-settings-${{ github.sha }}
          path: acceptance-evidence/
          if-no-files-found: warn
          retention-days: 14
