[package]
name = "eyeflow-portable"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
eyeflow-core = { path = "../../crates/eyeflow-core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomicwrites = "0.4"
