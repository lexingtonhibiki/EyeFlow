name: EyeFlow
options:
  bundleIdPrefix: com.eyeflow
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: EyeFlow
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  EyeFlow:
    type: application
    platform: iOS
    sources: [EyeFlow, Shared]
    dependencies:
      - target: EyeFlowMonitor
        embed: true
      - framework: Frameworks/EyeFlowCore.xcframework
        embed: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: EyeFlow/EyeFlow.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.eyeflow.mobile
        SWIFT_OBJC_BRIDGING_HEADER: EyeFlow/EyeFlow-Bridging-Header.h
    scheme:
      gatherCoverageData: false
  EyeFlowMonitor:
    type: app-extension
    platform: iOS
    sources: [MonitorExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyeflow.mobile.monitor
        CODE_SIGN_ENTITLEMENTS: MonitorExtension/MonitorExtension.entitlements
        INFOPLIST_FILE: MonitorExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
